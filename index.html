<title>PhytoClean | From Leaf To Relief</title>
<style>
:root{color-scheme:light;--green:#174d38;--leaf:#397b55;--pale:#eef5ed;--ink:#1d3026;--muted:#637268}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,#e2efdf 0,transparent 34%),linear-gradient(145deg,#f8fbf6,#edf4ec);color:var(--ink);display:grid;place-items:center;padding:28px}
main{width:min(100%,480px);text-align:center;background:rgba(255,255,255,.88);border:1px solid #dce8dc;border-radius:28px;padding:38px 26px 28px;box-shadow:0 20px 65px rgba(24,66,43,.10)}
.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:36px}
h1{margin:0;color:var(--green);font-size:clamp(2rem,8vw,2.6rem);letter-spacing:-.06em}
.tag{margin:8px 0 0;color:var(--leaf);font-weight:650;letter-spacing:.04em}
p.intro{margin:22px auto 26px;max-width:340px;color:var(--muted);line-height:1.65;font-size:.96rem}
.links{display:grid;gap:11px}
a.link{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 18px;border-radius:15px;background:#f2f7f1;border:1px solid #dce9dc;color:var(--green);text-decoration:none;font-weight:650;transition:transform .18s,background .18s}
a.link:hover{background:#e7f1e5;transform:translateY(-2px)}
a.primary{background:var(--green);color:#fff;border-color:var(--green)}
a.primary:hover{background:#216347}
.symbol{width:22px;text-align:center;font-size:1.05rem}
footer{margin-top:28px;color:#829087;font-size:.76rem;line-height:1.6}
footer strong{color:var(--leaf);font-weight:650}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🌿</div>
  <h1>PhytoClean</h1>
  <div class="tag">From Leaf To Relief</div>
  <p class="intro">Science inspired by nature. Follow our journey in developing plant-based ideas for oral care.</p>
